        { e: "140.- ¿Qué significa la sigla 'TAC'?", o: ["a) Tomografía Axial Computarizada.", "b) Tratamiento Asistido Clínico.", "c) Técnica de Análisis Corporal.", "d) Tomografía Avanzada de Contraste."], c: 0 },

        { e: "142.- Señale la respuesta que NO es correcta en el manejo de la silla de ruedas:", o: ["a) En las rampas, para subir lo haremos de frente.", "b) Para salir del ascensor, lo haremos de frente a la puerta.", "c) Para entrar en el ascensor se hará de espaldas al mismo.", "d) En las rampas para bajar lo haremos de frente."], c: 3 },
        { e: "143.- Señale la respuesta INCORRECTA respecto al oxígeno:", o: ["a) Es un gas poco reactivo.", "b) Su manipulación precisa de adopción de precauciones.", "c) Es un gas incoloro e insípido.", "d) Es un gas inodoro."], c: 0 },
        { e: "144.- Señale la respuesta que NO es correcta en el manejo de un paciente con bala de oxígeno:", o: ["a) Debemos colgar la bala de oxígeno en la cama del paciente.", "b) Si el traslado se realiza con el humidificador no se debe colocar la bala tumbada.", "c) Cerraremos el caudalímetro para prevenir fugas durante el traslado.", "d) a) y b) son correctas."], c: 2 },
        
        { e: "145.- El aparato que regula la nutrición vía sanguínea se denomina:", o: ["a) Bomba de nutrición enteral.", "b) Bomba de nutrición parenteral.", "c) Bomba de perfusión.", "d) Bomba de nutrición contínua."], c: 1 },
        { e: "146.- Señale la respuesta que NO es correcta en relación con el microdifusor electrotérmico:", o: ["a) Los tratamientos DVA proporcionan reducciones importantes en los niveles de contaminación microbiológica de todos los puntos, excepto en los más alejados.", "b) Es el sistema que permite la desinfección total de superficies a través del aire.", "c) Es un proceso en el que el aire sirve de vector de transmisión del aerosol biocida.", "d) b) y c) son verdaderas."], c: 0 },
        { e: "147.- El aparato cuya finalidad es registrar corrientes eléctricas del corazón se denomina:", o: ["a) Electrocardiógrafo.", "b) Ecocardiógrafo.", "c) Ecógrafo.", "d) a) y b) son correctas."], c: 0 },
        { e: "148.- Señale la respuesta correcta respecto al Escabel:", o: ["a) Puede utilizarse como ayuda para subir a la cama.", "b) Se utiliza para el descanso de los pies en pacientes que están sentados.", "c) Se utiliza para evitar el roce de las sábanas.", "d) a) y b) son correctas."], c: 3 },
        { e: "149.- Señala, de los siguientes sufijos, cuál significa 'aumento de volumen':", o: ["a) -logía.", "b) -tomía.", "c) -osis.", "d) -megalia."], c: 3 },
        { e: "150.- El trapecio o potencia:", o: ["a) Es un armazón metálico utilizado en camas traumatológicas.", "b) Es un dispositivo que permite limitar los movimientos de la cabeza y cuello.", "c) Es un recipiente para transportar muestras, recoger residuos orgánicos y de curas.", "d) Es un dispositivo a través del cual se ayuda el paciente para moverse en la cama."], c: 3 }

        // random 
        for (let i = banco.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [banco[i], banco[j]] = [banco[j], banco[i]];
        }

        //fin random

        let actual = 0;
        let puntos = 0;
        let respondido = false;

        function mostrar() {
            const p = banco[actual];
            document.getElementById("info").innerText = `Pregunta ${actual + 1} de ${banco.length} | Puntos: ${puntos}`;
            document.getElementById("pregunta").innerText = p.e;
            let html = "";
            p.o.forEach((opt, i) => {
                html += `<div class="option" id="opt${i}" onclick="select(${i})">${opt}</div>`;
            });
            document.getElementById("opciones").innerHTML = html;
            document.getElementById("btn").innerText = "Comprobar";
            respondido = false;
            window.selectedOpt = -1;
        }

        function select(i) {
            if(respondido) return;
            window.selectedOpt = i;
            for(let j=0; j<4; j++) document.getElementById("opt"+j).style.border = "1px solid #ccc";
            document.getElementById("opt"+i).style.border = "3px solid #326eb4";
        }

        function checkOrNext() {
            if(!respondido) {
                if(window.selectedOpt === -1) return;
                respondido = true;
                const p = banco[actual];
                if(window.selectedOpt === p.c) puntos++;
                document.getElementById("opt"+p.c).classList.add("correct");
                if(window.selectedOpt !== p.c) document.getElementById("opt"+window.selectedOpt).classList.add("wrong");
                document.getElementById("btn").innerText = "Siguiente";
            } else {
            actual++;
            if (actual < banco.length) {
                mostrar();
            } else {
                document.getElementById("pregunta").innerText = "Fin del cuestionario";
                document.getElementById("opciones").innerHTML = 
                    `<p style="text-align:center; font-size:1.2rem;">
                        Puntuación final: <strong>${puntos} / ${banco.length}</strong>
                    </p>`;
                document.getElementById("btn").style.display = "none";
            }
        }
        }
        mostrar();
    </script>
